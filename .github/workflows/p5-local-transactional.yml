name: P5 Local Transactional Homologation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p5-local-transactional.yml
      - scripts/p5-local-transactional.mjs
      - scripts/p2-local-composite.mjs
      - scripts/p4-local-admin-browser.mjs
      - src/components/admin/AdminApp.tsx
      - src/components/admin/AdminModules.tsx
      - src/lib/p2-composite-save.ts
      - supabase/migrations/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-cms-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.16.0"
      - name: Validate isolated configuration and tooling
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/p2-local-isolation.check.mjs
          node --check scripts/p5-local-transactional.mjs
          node --check scripts/p2-local-composite.mjs
          node --check scripts/p4-local-admin-browser.mjs
          docker info --format '{{.ServerVersion}}'
          npx --yes supabase@3.0.0 --version
          npx --yes supabase@3.0.0 start --help > /dev/null
      - name: Install application dependencies
        run: |
          npm install --global pnpm@10.34.8
          pnpm install --frozen-lockfile
      - name: Start fully isolated Supabase synthetic stack
        run: npx --yes supabase@3.0.0 start
      - name: Read only local connection details, never cloud credentials
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@3.0.0 status -o env > "$RUNNER_TEMP/p5-local-env"
          while IFS='=' read -r name value; do
            case "$name" in
              ANON_KEY|SERVICE_ROLE_KEY|API_URL)
                value="${value#\"}"
                value="${value%\"}"
                if [ "$name" = "ANON_KEY" ]; then
                  echo "::add-mask::$value"
                  printf 'P5_LOCAL_ANON_KEY=%s\n' "$value" >> "$GITHUB_ENV"
                elif [ "$name" = "SERVICE_ROLE_KEY" ]; then
                  echo "::add-mask::$value"
                  printf 'P5_LOCAL_SERVICE_KEY=%s\n' "$value" >> "$GITHUB_ENV"
                else
                  test "$value" = 'http://127.0.0.1:54321'
                fi
              ;;
            esac
          done < "$RUNNER_TEMP/p5-local-env"
      - name: Original eight synthetic scenarios
        env:
          P5_LOCAL_URL: http://127.0.0.1:54321/
        run: node scripts/p5-local-transactional.mjs
      - name: P2 composed RPC atomicity, CAS and rollback
        env:
          P5_LOCAL_URL: http://127.0.0.1:54321/
        run: node scripts/p2-local-composite.mjs
      - name: Authenticated synthetic CMS UI and public renderer E2E
        shell: bash
        env:
          P5_LOCAL_URL: http://127.0.0.1:54321/
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p4-browser"
          npm install --prefix "$RUNNER_TEMP/p4-browser" --no-save --no-audit --no-fund puppeteer-core@25.16.0
          cp "$GITHUB_WORKSPACE/scripts/p4-local-admin-browser.mjs" "$RUNNER_TEMP/p4-browser/suite.mjs"
          export VITE_SUPABASE_URL="http://127.0.0.1:54321"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$P5_LOCAL_ANON_KEY"
          pnpm exec vite --host 127.0.0.1 --port 5173 > "$RUNNER_TEMP/p4-vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          (cd "$RUNNER_TEMP/p4-browser" && node suite.mjs)
      - name: Stop isolated stack
        if: always()
        run: npx --yes supabase@3.0.0 stop || true