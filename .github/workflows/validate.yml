name: Validate PortfolioTulius

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.16.0"
      - name: Install pnpm 10.34.8
        run: npm install --global pnpm@10.34.8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Show suggested formatting changes
        if: failure()
        run: |
          pnpm exec oxfmt src
          git diff --no-ext-diff -- src
      - name: TypeScript
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Offline build smoke
        run: pnpm smoke:build
      - name: Browser suites syntax
        run: |
          node --check scripts/p3-browser-smoke.mjs
          node --check scripts/p4-visual-audit.mjs
          node --check scripts/p4-partial-failure.mjs
          node --check scripts/p4-seo-parity.mjs
          node --check scripts/p5-admin-readonly.mjs
          node --check scripts/p2-transactional-staging.mjs
          node --check scripts/p2-staging-preflight.mjs
          node --check scripts/p2-stage-destination.mjs
          node --check scripts/p2-local-isolation.mjs
          node --check scripts/p2-local-isolation.check.mjs
          node --check scripts/p2-local-preflight.mjs
          node --check scripts/p2-local-readonly.mjs
          node --test scripts/p2-local-isolation.check.mjs
          node --check scripts/p2-stage-destination.check.mjs
          node --test scripts/p2-stage-destination.check.mjs
          node --check scripts/p5-public-rls.mjs
          node --check scripts/p6-lighthouse-guard.mjs
          node --check scripts/p4-formation-visual-preview.mjs
          node --check scripts/p2-synthetic-fixtures.mjs
          node --check scripts/p2-synthetic-fixtures.check.mjs
          node --test scripts/p2-synthetic-fixtures.check.mjs
          node --check scripts/p2-cms-offline-contract.check.mjs
          node --test scripts/p2-cms-offline-contract.check.mjs
          node --check scripts/p6-seo-publish-simulation.mjs
          node --check scripts/p6-seo-publish-simulation.check.mjs
          node --test scripts/p6-seo-publish-simulation.check.mjs
