name: P5 Admin Read-Only E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/p5-admin-readonly.yml
      - docs/ESTADO_ATUAL_VIGENTE.md
      - scripts/p5-admin-readonly.mjs
      - src/components/admin/**
      - src/lib/hero-formatting.ts
      - src/types/content.ts

permissions:
  contents: read

jobs:
  admin-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.16.0"
      - name: Validate browser suite syntax
        run: node --check scripts/p5-admin-readonly.mjs
      - name: Verify live deployment matches tested SHA
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl --fail --silent --show-error --location --max-time 15 \
              -H 'Cache-Control: no-cache' \
              "https://tulius.work/p3-deployment.json?sha=$GITHUB_SHA&attempt=$attempt" || true)"
            if printf '%s' "$body" | node -e '
              let text = ""
              process.stdin.on("data", x => text += x)
              process.stdin.on("end", () => {
                try { process.exit(JSON.parse(text).sha === process.env.GITHUB_SHA ? 0 : 1) }
                catch { process.exit(1) }
              })
            '; then
              echo "P5_DEPLOYMENT_GATE MATCH sha=$GITHUB_SHA"
              exit 0
            fi
            sleep 4
          done
          echo "P5_DEPLOYMENT_GATE FAIL: production SHA mismatch" >&2
          exit 1
      - name: Install browser driver
        run: |
          mkdir -p "$RUNNER_TEMP/p5-browser"
          cd "$RUNNER_TEMP/p5-browser"
          npm install --no-save --no-audit --no-fund puppeteer-core@25.16.0
          cp "$GITHUB_WORKSPACE/scripts/p5-admin-readonly.mjs" suite.mjs
      - name: Run authenticated read-only browser checks
        env:
          P5_ADMIN_EMAIL: ${{ secrets.P5_ADMIN_EMAIL }}
          P5_ADMIN_PASSWORD: ${{ secrets.P5_ADMIN_PASSWORD }}
          P5_BASE_URL: https://tulius.work
        run: |
          cd "$RUNNER_TEMP/p5-browser"
          node suite.mjs
